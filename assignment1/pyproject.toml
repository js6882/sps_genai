[project]
name = "sps-genai"
version = "0.1.0"
description = "Module 3 FastAPI application extended with spaCy word embeddings"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "spacy>=3.8,<3.9",
    "en-core-web-lg",
]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
